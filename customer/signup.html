<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Grover Properties</title>

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <link rel="stylesheet" href="../css/style.css">

    <style>

        body {
            min-height: 100vh;
            background: #f7f7f7;
        }

        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .auth-card {
            width: 100%;
            max-width: 460px;
            background: #fff;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(0,0,0,.10);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-logo h1 {
            margin: 0 0 6px;
        }

        .auth-logo p {
            margin: 0;
            color: #666;
        }

        .auth-form {
            display: grid;
            gap: 16px;
        }

        .auth-form label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .auth-form input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 13px;
            border: 1px solid #d5d5d5;
            border-radius: 8px;
            font-size: 15px;
        }

        .auth-form input:focus {
            outline: none;
            border-color: #b58b45;
        }

        .auth-btn {
            width: 100%;
            border: 0;
            cursor: pointer;
            padding: 13px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
        }

        .auth-message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .auth-message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .auth-message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .auth-footer {
            text-align: center;
            margin-top: 22px;
            color: #666;
            font-size: 14px;
        }

        .auth-footer a {
            font-weight: 700;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #666;
            text-decoration: none;
        }

        @media (max-width: 500px) {

            .auth-card {
                padding: 25px 20px;
            }

        }

    </style>

</head>


<body>


<div class="auth-page">

    <div class="auth-card">


        <div class="auth-logo">

            <h1>
                Grover Properties
            </h1>

            <p>
                Create your customer account
            </p>

        </div>


        <form
            id="signupForm"
            class="auth-form"
        >


            <div>

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >

            </div>


            <div>

                <label for="phone">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your mobile number"
                    autocomplete="tel"
                    required
                >

            </div>


            <div>

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <div>

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Minimum 6 characters"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <div>

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <div
                id="signupMessage"
                class="auth-message"
            ></div>


            <button
                type="submit"
                id="signupBtn"
                class="auth-btn btn-primary"
            >
                Create Account
            </button>


        </form>


        <div class="auth-footer">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>


        <a
            href="../index.html"
            class="back-home"
        >
            ← Back to Website
        </a>


    </div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        const {
            data: {
                user
            }
        } =
            await supabaseClient.auth.getUser();


        /*
         * Already logged in?
         */

        if (user) {

            window.location.href =
                "account.html";

            return;

        }


        const form =
            document.getElementById(
                "signupForm"
            );


        const button =
            document.getElementById(
                "signupBtn"
            );


        const message =
            document.getElementById(
                "signupMessage"
            );


        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const name =
                    document
                        .getElementById("name")
                        .value
                        .trim();


                const phone =
                    document
                        .getElementById("phone")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;


                if (
                    password !==
                    confirmPassword
                ) {

                    showMessage(
                        "Passwords do not match.",
                        "error"
                    );

                    return;

                }


                if (password.length < 6) {

                    showMessage(
                        "Password must be at least 6 characters.",
                        "error"
                    );

                    return;

                }


                button.disabled = true;

                button.textContent =
                    "Creating Account...";


                try {

                    const {
                        data,
                        error
                    } =
                        await supabaseClient.auth.signUp({

                            email: email,

                            password: password,

                            options: {

                                data: {

                                    full_name:
                                        name,

                                    phone:
                                        phone

                                },

                                emailRedirectTo:
                                    `${window.location.origin}/customer/account.html`

                            }

                        });


                    if (error)
                        throw error;


                    /*
                     * If email confirmation is enabled,
                     * Supabase may return a user but no session.
                     */

                    if (
                        data.user &&
                        !data.session
                    ) {

                        showMessage(
                            "Account created successfully! Please check your email and confirm your email address before logging in.",
                            "success"
                        );


                        form.reset();


                    } else {

                        showMessage(
                            "Account created successfully. Redirecting...",
                            "success"
                        );


                        setTimeout(
                            () => {

                                window.location.href =
                                    "account.html";

                            },
                            1000
                        );

                    }

                }

                catch (error) {

                    console.error(
                        "Signup error:",
                        error
                    );


                    showMessage(
                        error.message ||
                        "Unable to create account.",
                        "error"
                    );

                }

                finally {

                    button.disabled = false;

                    button.textContent =
                        "Create Account";

                }

            }
        );


        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                `auth-message ${type}`;

        }

    }
);

</script>


</body>

</html>
