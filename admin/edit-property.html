<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Property | Grover Properties</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">

</head>

<body class="admin-body">


<header class="admin-navbar">

    <div class="container admin-nav-inner">

        <strong>
            Grover Properties — Admin
        </strong>

        <a
            href="dashboard.html"
            class="btn btn-gold"
        >
            Dashboard
        </a>

    </div>

</header>


<main class="admin-content">

<div class="container">

<div
    class="admin-card"
    id="editContainer"
>

    <div class="loading">
        Loading property...
    </div>

</div>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>


<script>

let propertyId = null;
let existingImages = [];
let newFiles = [];

const params =
    new URLSearchParams(window.location.search);

propertyId =
    params.get("id");


async function loadProperty() {

    if (!propertyId) {

        document.getElementById("editContainer")
            .innerHTML =
            `<div class="empty">
                Property ID missing.
            </div>`;

        return;
    }

    const { data, error } =
        await supabaseClient
            .from("properties")
            .select("*")
            .eq("id", propertyId)
            .single();

    if (error || !data) {

        document.getElementById("editContainer")
            .innerHTML =
            `<div class="empty">
                Property not found.
            </div>`;

        return;
    }

    existingImages =
        data.images || [];

    renderForm(data);
}


function renderForm(p) {

    document.getElementById("editContainer")
        .innerHTML = `

        <h1>
            Edit Property
        </h1>

        <p style="color:#64748b;margin:8px 0 25px">
            Update property information.
        </p>


        <form id="editForm">

        <div class="form-grid">


        <div class="form-group form-full">

            <label>Property Title *</label>

            <input
                class="input"
                name="title"
                required
                value="${escapeHtml(p.title)}"
            >

        </div>


        <div class="form-group">

            <label>Property Type *</label>

            <select
                class="select"
                name="property_type"
                required
            >

                ${["Residential","Commercial","Plot","Land"]
                    .map(x =>
                        `<option
                            ${p.property_type === x ? "selected" : ""}
                        >${x}</option>`
                    ).join("")}

            </select>

        </div>


        <div class="form-group">

            <label>Listing Type *</label>

            <select
                class="select"
                name="listing_type"
            >

                <option
                    ${p.listing_type === "Sale" ? "selected" : ""}
                >
                    Sale
                </option>

                <option
                    ${p.listing_type === "Rent" ? "selected" : ""}
                >
                    Rent
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>Price *</label>

            <input
                class="input"
                type="number"
                name="price"
                value="${p.price}"
                required
            >

        </div>


        <div class="form-group">

            <label>Location *</label>

            <input
                class="input"
                name="location"
                value="${escapeHtml(p.location)}"
                required
            >

        </div>


        <div class="form-group form-full">

            <label>Address</label>

            <input
                class="input"
                name="address"
                value="${escapeHtml(p.address || "")}"
            >

        </div>


        <div class="form-group">

            <label>Area</label>

            <input
                class="input"
                type="number"
                name="area"
                value="${p.area || ""}"
            >

        </div>


        <div class="form-group">

            <label>Area Unit</label>

            <select class="select" name="area_unit">

                ${["sq.ft","sq.yd","acre","marla"]
                    .map(x =>
                        `<option
                            ${p.area_unit === x ? "selected" : ""}
                        >${x}</option>`
                    ).join("")}

            </select>

        </div>


        <div class="form-group">

            <label>Bedrooms</label>

            <input
                class="input"
                type="number"
                name="bedrooms"
                value="${p.bedrooms || ""}"
            >

        </div>


        <div class="form-group">

            <label>Bathrooms</label>

            <input
                class="input"
                type="number"
                name="bathrooms"
                value="${p.bathrooms || ""}"
            >

        </div>


        <div class="form-group">

            <label>Furnishing</label>

            <input
                class="input"
                name="furnishing"
                value="${escapeHtml(p.furnishing || "")}"
            >

        </div>


        <div class="form-group">

            <label>Parking</label>

            <input
                class="input"
                name="parking"
                value="${escapeHtml(p.parking || "")}"
            >

        </div>


        <div class="form-group form-full">

            <label>Features</label>

            <input
                class="input"
                name="features"
                value="${escapeHtml((p.features || []).join(", "))}"
            >

        </div>


        <div class="form-group form-full">

            <label>Description *</label>

            <textarea
                class="textarea"
                name="description"
                required
            >${escapeHtml(p.description)}</textarea>

        </div>


        <div class="form-group">

            <label>Status</label>

            <select class="select" name="status">

                ${["Available","Sold","Rented"]
                    .map(x =>
                        `<option
                            ${p.status === x ? "selected" : ""}
                        >${x}</option>`
                    ).join("")}

            </select>

        </div>


        <div class="form-group">

            <label>Featured</label>

            <select class="select" name="featured">

                <option
                    value="false"
                    ${!p.featured ? "selected" : ""}
                >
                    No
                </option>

                <option
                    value="true"
                    ${p.featured ? "selected" : ""}
                >
                    Yes
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>Owner Name</label>

            <input
                class="input"
                name="owner_name"
                value="${escapeHtml(p.owner_name || "")}"
            >

        </div>


        <div class="form-group">

            <label>Owner Phone</label>

            <input
                class="input"
                name="owner_phone"
                value="${escapeHtml(p.owner_phone || "")}"
            >

        </div>


        <div class="form-group form-full">

            <label>Existing Images</label>

            <div class="image-preview">

                ${
                    existingImages.map((image, index) => `
                        <div>
                            <img src="${escapeHtml(image)}">
                            <button
                                type="button"
                                onclick="removeExistingImage(${index})"
                                style="
                                width:100%;
                                border:0;
                                padding:5px;
                                margin-top:3px;
                                background:#fee2e2;
                                color:#b91c1c;
                                "
                            >
                                Remove
                            </button>
                        </div>
                    `).join("")
                }

            </div>

        </div>


        <div class="form-group form-full">

            <label>Add New Images</label>

            <input
                class="input"
                id="newImages"
                type="file"
                accept="image/*"
                multiple
            >

        </div>


        <div class="form-full">

            <button
                class="btn btn-primary"
                type="submit"
            >
                Save Changes
            </button>

        </div>


        </div>

        </form>

        <p id="message" style="margin-top:15px"></p>
    `;


    document
        .getElementById("newImages")
        .addEventListener("change", e => {

            newFiles =
                Array.from(e.target.files);

        });


    document
        .getElementById("editForm")
        .addEventListener(
            "submit",
            saveProperty
        );
}


function removeExistingImage(index) {

    existingImages.splice(index, 1);

    loadProperty();
}


async function saveProperty(e) {

    e.preventDefault();

    const form = e.target;

    const message =
        document.getElementById("message");

    const button =
        form.querySelector("button[type='submit']");

    button.disabled = true;
    button.textContent = "Saving...";

    try {

        const fd =
            new FormData(form);

        const newUrls = [];

        for (const file of newFiles) {

            const extension =
                file.name.split(".").pop();

            const filename =
                `${propertyId}/${crypto.randomUUID()}.${extension}`;

            const { error } =
                await supabaseClient
                    .storage
                    .from("property-images")
                    .upload(filename, file, {
                        cacheControl: "3600",
                        upsert: false
                    });

            if (error)
                throw error;

            const { data } =
                supabaseClient
                    .storage
                    .from("property-images")
                    .getPublicUrl(filename);

            newUrls.push(data.publicUrl);
        }


        const finalImages =
            [...existingImages, ...newUrls];


        const { error } =
            await supabaseClient
                .from("properties")
                .update({

                    title: fd.get("title"),

                    description:
                        fd.get("description"),

                    property_type:
                        fd.get("property_type"),

                    listing_type:
                        fd.get("listing_type"),

                    price:
                        Number(fd.get("price")),

                    location:
                        fd.get("location"),

                    address:
                        fd.get("address") || "",

                    area:
                        fd.get("area")
                            ? Number(fd.get("area"))
                            : null,

                    area_unit:
                        fd.get("area_unit"),

                    bedrooms:
                        fd.get("bedrooms")
                            ? Number(fd.get("bedrooms"))
                            : null,

                    bathrooms:
                        fd.get("bathrooms")
                            ? Number(fd.get("bathrooms"))
                            : null,

                    furnishing:
                        fd.get("furnishing") || "",

                    parking:
                        fd.get("parking") || "",

                    features:
                        (fd.get("features") || "")
                            .split(",")
                            .map(x => x.trim())
                            .filter(Boolean),

                    status:
                        fd.get("status"),

                    featured:
                        fd.get("featured") === "true",

                    owner_name:
                        fd.get("owner_name") || "",

                    owner_phone:
                        fd.get("owner_phone") || "",

                    images:
                        finalImages

                })
                .eq("id", propertyId);


        if (error)
            throw error;


        message.style.color =
            "#15803d";

        message.textContent =
            "Property updated successfully.";

        newFiles = [];

        setTimeout(() => {
            window.location.href =
                "dashboard.html";
        }, 1000);


    } catch (error) {

        console.error(error);

        message.style.color =
            "#dc2626";

        message.textContent =
            error.message ||
            "Unable to update property.";

        button.disabled = false;
        button.textContent = "Save Changes";
    }
}


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


loadProperty();

</script>

</body>
</html>
