<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Properties for Sale & Rent | Grover Properties</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/properties.css">

</head>

<body>

<header class="navbar">

    <div class="container nav-inner">

        <a href="index.html" class="logo">

            <div class="logo-mark">
                GP
            </div>

            <div class="logo-text">
                <strong>Grover Properties</strong>
                <span>KARNAL • HARYANA</span>
            </div>

        </a>

        <nav class="nav-links">

            <a href="index.html">Home</a>

            <a href="properties.html">Buy Property</a>

            <a href="sell-property.html">Sell Property</a>

            <a href="about.html">About</a>

            <a href="contact.html">Contact</a>

            <a
                class="nav-cta"
                target="_blank"
                href="https://wa.me/919068012912"
            >
                WhatsApp
            </a>

        </nav>

        <button class="mobile-menu">☰</button>

    </div>

</header>


<section class="page-header">

    <div class="container">

        <h1>
            Properties
        </h1>

        <p>
            Explore properties available in Karnal.
        </p>

    </div>

</section>


<main class="section properties-page">

<div class="container">


<div class="filters">

    <div class="filter-grid">

        <input
            class="input"
            id="filterLocation"
            placeholder="Location"
        >

        <select
            class="select"
            id="filterType"
        >

            <option value="">
                All Types
            </option>

            <option value="Residential">
                Residential
            </option>

            <option value="Commercial">
                Commercial
            </option>

            <option value="Plot">
                Plot
            </option>

            <option value="Land">
                Land
            </option>

        </select>


        <select
            class="select"
            id="filterListing"
        >

            <option value="">
                Sale / Rent
            </option>

            <option value="Sale">
                For Sale
            </option>

            <option value="Rent">
                For Rent
            </option>

        </select>


        <button
            class="btn btn-primary"
            onclick="applyFilters()"
        >
            Search
        </button>

    </div>

</div>


<div class="results-bar">

    <strong>
        Available Properties
    </strong>

    <span
        id="resultsCount"
        class="results-count"
    >
        Loading...
    </span>

</div>


<div
    id="propertyGrid"
    class="property-grid"
>

    <div class="loading">
        Loading properties...
    </div>

</div>


</div>

</main>


<footer class="footer">

    <div class="container">

        <div class="footer-bottom">
            © 2026 Grover Properties. All rights reserved.
        </div>

    </div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>
<script src="js/main.js"></script>
<script src="js/properties.js"></script>

</body>
</html>
