<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sell Your Property | Grover Properties</title>
    <meta
    name="description"
    content="Want to sell your property in Karnal? Submit your property details to Grover Properties for buying and selling assistance."
>

<link rel="canonical" href="https://groverproperties.netlify.app/sell-property.html">

<meta property="og:type" content="website">
<meta property="og:title" content="Sell Your Property in Karnal | Grover Properties">
<meta property="og:description" content="Sell your house, plot, residential or commercial property in Karnal with Grover Properties.">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="navbar">

    <div class="container nav-inner">

        <a href="index.html" class="logo">

            <div class="logo-mark">
                GP
            </div>

            <div class="logo-text">
                <strong>Grover Properties</strong>
                <span>KARNAL • HARYANA</span>
            </div>

        </a>

        <nav class="nav-links">

            <a href="index.html">Home</a>
            <a href="properties.html">Buy Property</a>
            <a href="sell-property.html">Sell Property</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="customer/login.html" id="customerProfileLink">
            👤 Profile
            </a>

        </nav>

    </div>

</header>


<section class="page-header">

    <div class="container">

        <h1>
            Sell Your Property
        </h1>

        <p>
            Tell Grover Properties about your property.
        </p>

    </div>

</section>


<section class="section section-light">

<div class="container">

<form
    class="form-container"
    id="sellPropertyForm"
>

    <div class="form-grid">


        <div class="form-group">

            <label>
                Your Name *
            </label>

            <input
                class="input"
                name="name"
                required
                placeholder="Full name"
            >

        </div>


        <div class="form-group">

            <label>
                Phone Number *
            </label>

            <input
                class="input"
                name="phone"
                type="tel"
                required
                placeholder="+91"
            >

        </div>


        <div class="form-group">

            <label>
                Email
            </label>

            <input
                class="input"
                name="email"
                type="email"
                placeholder="Email address"
            >

        </div>


        <div class="form-group">

            <label>
                Property Type
            </label>

            <select
                class="select"
                name="property_type"
            >

                <option value="">
                    Select
                </option>

                <option>
                    Residential
                </option>

                <option>
                    Commercial
                </option>

                <option>
                    Plot
                </option>

                <option>
                    Land
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                Property Location
            </label>

            <input
                class="input"
                name="location"
                placeholder="Area / locality in Karnal"
            >

        </div>


        <div class="form-group">

            <label>
                Expected Price
            </label>

            <input
                class="input"
                name="expected_price"
                placeholder="e.g. ₹50,00,000"
            >

        </div>


        <div class="form-group form-full">

            <label>
                Property Details
            </label>

            <textarea
                class="textarea"
                name="message"
                placeholder="Tell us about your property..."
            ></textarea>

        </div>


        <div class="form-full">

            <button
                class="btn btn-primary"
                type="submit"
            >
                Submit Property
            </button>

        </div>

    </div>

</form>

</div>

</section>


<footer class="footer">

    <div class="container">

        <div class="footer-bottom">
            © 2026 Grover Properties. All rights reserved.
        </div>

    </div>

</footer>


<div class="toast"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>
<script src="js/main.js"></script>
<script src="js/sell-property.js"></script>

</body>
</html>
